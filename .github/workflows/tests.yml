name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            symfony: '^5.4'
          - php: '8.1'
            symfony: '^6.0'
          - php: '8.2'
            symfony: '^7.0'
          - php: '8.4'
            symfony: '^8.0'
          - php: '8.5'
            symfony: '^8.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --no-check-publish
      - run: composer update --no-interaction --no-progress --with "symfony/config:${{ matrix.symfony }}" --with "symfony/console:${{ matrix.symfony }}"
      - run: vendor/bin/phpunit
